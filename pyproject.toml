[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenfactory-proxy"
version = "1.0.0"
description = "OpenAI-compatible reverse proxy for KT TokenFactory (tokenfactory.kt.com)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx[socks]>=0.27",
  "pydantic>=2.5",
  "PyYAML>=6.0",
  "cryptography>=42.0",
  "requests>=2.31",
]

[project.optional-dependencies]
browser = ["playwright>=1.40", "DrissionPage>=4.0"]

[project.scripts]
tokenfactory-proxy = "tfproxy.__main__:main"

[tool.setuptools.packages.find]
include = ["tfproxy*"]
